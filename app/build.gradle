plugins { id 'com.android.application' }

android {
    namespace 'com.dvaustria.motor'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.dvaustria.motor'
        minSdk 24            // Android 7.0+ (GLES 3.0 phones, includes old low-end devices)
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -ffast-math -fno-exceptions -fno-rtti'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    sourceSets { main { assets.srcDirs = ["${rootDir}/assets"] } }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installable without a keystore
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
    }
    packagingOptions { jniLibs { useLegacyPackaging = false } }
    androidResources { noCompress 'mdl' }
}
